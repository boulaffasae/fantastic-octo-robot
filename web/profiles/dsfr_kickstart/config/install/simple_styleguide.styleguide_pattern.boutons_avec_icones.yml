description:
  value: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Il est possible d''ajouter une icône à votre bouton permettant une meilleure compréhension de l’action. Pour cela il suffit d’utiliser la classe CSS de l’icône (</span><a style="--active-tint:var(--active);--hover-tint:var(--idle);-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);background-image:var(--underline-img),var(--underline-img);background-position:var(--underline-x) 100%,var(--underline-x) calc(100% - var(--underline-thickness));background-repeat:no-repeat, no-repeat;background-size:var(--underline-hover-width) calc(var(--underline-thickness)*2),var(--underline-idle-width) var(--underline-thickness);box-sizing:inherit;color:inherit;cursor:pointer;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;outline-color:rgb(10, 118, 246);outline-offset:2px;outline-width:2px;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;transition:background-size 0s ease 0s;white-space:normal;widows:2;word-spacing:0px;" href="https://www.systeme-de-design.gouv.fr/elements-d-interface/fondamentaux-techniques/icone" target="_self">voir la documentation des icônes</a><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">)</span></p>'
  format: full_html
pattern: "<!-- Bouton  icône à gauche-->\r\n\r\n<button class=\"fr-btn fr-btn--icon-left fr-icon-checkbox-circle-line\">\r\n    Label bouton\r\n</button>\r\n\r\n<!-- Bouton icône à droite-->\r\n\r\n<button class=\"fr-btn fr-btn--icon-right fr-icon-checkbox-circle-line\">\r\n    Label bouton\r\n</button>\r\n\r\n<!-- Bouton icône seule -->\r\n\r\n<button class=\"fr-btn  fr-icon-checkbox-circle-line\" title=\"Label bouton\">\r\n   Label bouton\r\n</button>"
