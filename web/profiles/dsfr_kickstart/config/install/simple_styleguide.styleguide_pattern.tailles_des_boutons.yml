description:
  value: '<div class="fr-grid-row" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(58, 58, 58);display:flex;flex-wrap:wrap;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><div class="fr-col" style="box-sizing:inherit;flex:1 1 0%;"><p style="box-sizing:inherit;font-size:1rem;line-height:1.5rem;margin:var(--text-spacing);">Les boutons primaires et secondaires sont disponibles en 3 tailles :</p></div></div><ul style="--xl-size:var(--xl-base);-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(58, 58, 58);font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;list-style-type:var(--ul-type);margin:var(--text-spacing);orphans:2;padding-bottom:0px;padding-left:var(--ul-start);padding-right:0px;padding-top:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="--xl-base:calc(var(--xl-size)*0.9);box-sizing:inherit;padding-bottom:var(--li-bottom);">SM pour Small, MD pour Medium, LG pour large.</li><li style="--xl-base:calc(var(--xl-size)*0.9);box-sizing:inherit;padding-bottom:var(--li-bottom);">La taille medium (MD) est la taille de bouton par défaut.</li><li style="--xl-base:calc(var(--xl-size)*0.9);box-sizing:inherit;padding-bottom:var(--li-bottom);">Les formats MD et LG sont à utiliser en priorité.</li><li style="--xl-base:calc(var(--xl-size)*0.9);box-sizing:inherit;padding-bottom:var(--li-bottom);">Le format SM pourra être utilisé pour créer certains composants, évitez de l’utiliser en mobile car la zone de “touch” sur écran tactile n’est pas suffisante.</li></ul>'
  format: full_html
pattern: "<!-- bouton au format SM -->\r\n\r\n<button class=\"fr-btn fr-btn--sm fr-fi-checkbox-circle-line fr-btn--icon-left fr-btn--secondary\">\r\n   Label bouton SM\r\n</button>\r\n\r\n\r\n<button class=\"fr-btn fr-fi-checkbox-circle-line fr-btn--icon-left fr-btn--secondary\">\r\n   Label bouton MD (défaut)\r\n</button>\r\n\r\n\r\n<button class=\"fr-btn fr-btn--lg fr-fi-checkbox-circle-line fr-btn--icon-left fr-btn--secondary\">\r\n   Label bouton LG\r\n</button>"
