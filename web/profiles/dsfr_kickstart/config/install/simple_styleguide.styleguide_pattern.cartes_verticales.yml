label: 'Cartes verticales'
description:
  value: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">La carte est un lien vers une page éditoriale dont elle donne un aperçu. Elle fait généralement partie d''une collection ou liste d’aperçus de contenu similaires. La carte n’est jamais présentée de manière isolée.</span></p>'
  format: full_html
pattern: "<div class=\"fr-grid-row fr-mb-3w\">\r\n    <div class=\"fr-col fr-col-md-6\">\r\n        <div class=\"fr-card fr-enlarge-link\">\r\n            <div class=\"fr-card__body\">\r\n                <div class=\"fr-card__content\">\r\n                    <h3 class=\"fr-card__title\">\r\n                        <a href=\"#\">Qu'est-ce que le Pass Culture et comment l’obtenir ?</a>\r\n                    </h3>\r\n                    <p class=\"fr-card__desc\">La carte donne des aperçus cliquables d’une page de contenu à l’utilisateur. Elle fait généralement partie d'une collection ou liste d’aperçus de contenu similaires. La carte n’est jamais présentée de manière isolée.</p>\r\n                </div>\r\n            </div>\r\n            <div class=\"fr-card__header\">\r\n                <div class=\"fr-card__img\">\r\n                    <img class=\"fr-responsive-img\" src=\"/themes/contrib/dsfr/src/public/img/placeholder.16x9.png\" alt=\"[À MODIFIER - vide ou texte alternatif de l’image]\">\r\n                    <!-- L’alternative de l’image (attribut alt) doit toujours être présente, sa valeur peut-être vide (image n’apportant pas de sens supplémentaire au contexte) ou non (porteuse de texte ou apportant du sens) selon votre contexte -->\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</div>"
