id: alertes_avec_bouton_de_fermeture
label: 'Alertes avec bouton de fermeture'
description:
  value: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Il est possible d’ajouter un bouton de fermeture afin que l’utilisateur puisse masquer l’alerte. La fermeture peut ou non être gérée par le javascript du DSFR.</span></p>'
  format: full_html
pattern: "<div class=\"fr-alert fr-alert--info\">\r\n    <h3 class=\"fr-alert__title\">Information Covid</h3>\r\n    <p>Cliquer sur la croix pour fermer l'alerte</p>\r\n    <button class=\"fr-btn--close fr-btn\" title=\"Masquer le message\" onclick=\"const alert = this.parentNode; alert.parentNode.removeChild(alert)\">\r\n        Masquer le message\r\n    </button>\r\n</div>"
weight: -2
