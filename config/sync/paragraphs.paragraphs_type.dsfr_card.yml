label: Carte
icon_uuid: bf431783-76e9-450e-ac4a-35140239498d
icon_default: 'data:image/svg+xml;base64,'
description: "La carte est un lien vers une page éditoriale dont elle donne un aperçu. Elle fait généralement partie d'une collection ou liste d’aperçus de contenu similaires. La carte n’est jamais présentée de manière isolée.\r\n\r\nLa carte existe en trois tailles (LG, MD, SM) et deux formats (horizontale et verticale), déclinés sur deux supports (desktop et mobile). Les cartes horizontales sont réservées au desktop (en mobile, une carte horizontale devient verticale)."
