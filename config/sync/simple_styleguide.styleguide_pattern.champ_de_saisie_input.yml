id: champ_de_saisie_input
label: 'Champ de saisie - Input'
description:
  value: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Les champs permettent à un utilisateur d''entrer du contenu et données. Le champ simple est un champ de saisie libre, qui accepte une courte ligne de contenu (texte ou/ et nombre). Le libellé se trouve au-dessus du champ de saisie, pour faciliter la lecture.</span></p>'
  format: full_html
pattern: "<label class=\"fr-label\" for=\"text-input-text\">Label champ de saisie</label>\r\n<input class=\"fr-input\" type=\"text\" id=\"text-input-text\" name=\"text-input-text\">\r\n\r\n<!-- Etat erreur -->\r\n<div class=\"fr-input-group fr-input-group--error\">\r\n    <label class=\"fr-label\" for=\"text-input-error\">\r\n      Label champs de saisie\r\n    </label>\r\n    <input class=\"fr-input fr-input--error\" aria-describedby=\"text-input-error-desc-error\" type=\"text\" id=\"text-input-error\" name=\"text-input-error\">\r\n    <p id=\"text-input-error-desc-error\" class=\"fr-error-text\">\r\n      Texte d’erreur obligatoire\r\n    </p>\r\n</div>\r\n\r\n<!-- Etat validé -->\r\n<div class=\"fr-input-group fr-input-group--valid\">\r\n    <label class=\"fr-label\" for=\"text-input-valid\">\r\n      Label champs de saisie\r\n    </label>\r\n    <input class=\"fr-input fr-input--valid\" aria-describedby=\"text-input-valid-desc-valid\" type=\"text\" id=\"text-input-valid\" name=\"text-input-valid\">\r\n    <p id=\"text-input-valid-desc-valid\" class=\"fr-valid-text\">\r\n      Texte de validation\r\n    </p>\r\n</div>"
weight: -7
