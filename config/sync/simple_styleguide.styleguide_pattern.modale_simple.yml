description:
  value: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(58, 58, 58);display:inline !important;float:none;font-family:Marianne, arial, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">La modale par défaut permet de mettre en évidence une information qui ne nécessite pas d’action de l’utilisateur. Elle s’affiche à la suite du clic sur un bouton.</span></p>'
  format: full_html
pattern: "<!--Bouton d'ouverture de la modale-->\r\n\r\n<button class=\"fr-btn\"  data-fr-opened=\"false\" aria-controls=\"fr-modal-1\">\r\n    Titre de modal simple\r\n</button>\r\n\r\n<!-- Modale Simple\r\n     La balise <dialog> peut être placée n'importe où sur la page, toutefois\r\n     nous vous conseillons, si vous en avez la possibilité,\r\n     d'en faire un enfant direct de la balise <body>\r\n-->\r\n\r\n<dialog aria-labelledby=\"fr-modal-title-modal-1\" role=\"dialog\" id=\"fr-modal-1\" class=\"fr-modal\">\r\n    <div class=\"fr-container fr-container--fluid fr-container-md\">\r\n        <div class=\"fr-grid-row fr-grid-row--center\">\r\n            <div class=\"fr-col-12 fr-col-md-8 fr-col-lg-6\">\r\n                <div class=\"fr-modal__body\">\r\n                    <div class=\"fr-modal__header\">\r\n                        <button class=\"fr-link--close fr-link\" title=\"Fermer la fenêtre modale\" aria-controls=\"fr-modal-1\">Fermer</button>\r\n                    </div>\r\n                    <div class=\"fr-modal__content\">\r\n                        <h1 id=\"fr-modal-title-modal-1\" class=\"fr-modal__title\"><span class=\"fr-fi-arrow-right-line fr-fi--lg\"></span>Titre de la modale</h1>\r\n                        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas varius tortor nibh, sit amet tempor nibh finibus et. Aenean eu enim justo. Vestibulum aliquam hendrerit molestie. Mauris malesuada nisi sit amet augue accumsan tincidunt. Maecenas tincidunt, velit ac porttitor pulvinar, tortor eros facilisis libero, vitae commodo nunc quam et ligula. Ut nec ipsum sapien. Interdum et malesuada fames ac ante ipsum primis in faucibus. Integer id nisi nec nulla luctus lacinia non eu turpis. Etiam in ex imperdiet justo tincidunt egestas. Ut porttitor urna ac augue cursus tincidunt sit amet sed orci.</p>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</dialog>"
